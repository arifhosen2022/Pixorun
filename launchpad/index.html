<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07050d;color:#f8efff;font-family:'VT323',monospace;background-image:linear-gradient(rgba(167,76,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(167,76,255,.055) 1px,transparent 1px),radial-gradient(ellipse at 50% 38%,#351052 0,transparent 58%);background-size:8px 8px,8px 8px,auto;display:flex;flex-direction:column}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}.nav{height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #8d45c955;position:relative;z-index:10}.logo img{width:145px;height:auto;display:block}.menu-wrap{position:relative;margin-left:auto;z-index:12}.menu-toggle{width:48px;height:48px;display:grid;place-items:center;border:2px solid #c16aff;background:#160d25;color:#fff;box-shadow:4px 4px 0 #4e1b79;cursor:pointer}.menu-toggle .dots{font:32px monospace;transform:translateY(-2px)}.menu-pop{position:absolute;right:0;top:calc(100% + 12px);width:225px;padding:9px;display:none;z-index:15;background:#10091b;border:2px solid #c16aff;box-shadow:6px 6px 0 #4e1b79}.menu-pop.open{display:block}.menu-pop a{display:flex;justify-content:space-between;padding:14px;min-height:48px;color:#fff;background:#170e26;border-bottom:1px solid #5d3183;font:21px 'VT323',monospace}.menu-pop a:hover,.menu-pop a.active{background:#6f2ca5}.main{flex:1;display:grid;place-items:center;text-align:center;padding:70px 0 90px}.notice{width:min(760px,100%);padding:clamp(28px,6vw,58px) 22px;border:1px solid #a34cff88;background:linear-gradient(145deg,#160e23dd,#0d0914ee);box-shadow:8px 8px 0 #28103e;position:relative}.notice:before{content:"";position:absolute;inset:8px;border:1px solid #8d45c944;pointer-events:none}.eyebrow{position:relative;color:#d9b5ff;font:9px/2 'Press Start 2P',monospace}.status{position:relative;display:inline-block;margin:25px 0 20px;padding:10px 13px;border:1px solid #bd62ff;color:#e6c8ff;background:#29113e;font:8px/1.8 'Press Start 2P',monospace;letter-spacing:.02em}.notice h1{position:relative;margin:0;color:#fff;font:clamp(22px,5vw,38px)/1.8 'Press Start 2P',monospace;text-shadow:0 0 28px #a34cff66}.notice h1 span{color:#c58aff}.notice p{position:relative;max-width:540px;margin:18px auto 0;color:#c2afd5;font-size:25px;line-height:1.35}.footer{padding:20px 0 24px;border-top:1px solid #8d45c955;color:#9f8caf;font-size:11px}.footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px}.footer-social{margin-left:auto;display:inline-flex;align-items:center;gap:8px;color:#d8a6ff;font:8px 'Press Start 2P',monospace;border:1px solid #a34cff66;padding:10px 12px;background:#160d25;box-shadow:3px 3px 0 #28103e}@media(max-width:600px){.nav{height:72px}.logo img{width:125px}.eyebrow{font-size:7px}.notice p{font-size:22px}.footer{font-size:9px}.footer-social{font-size:7px;padding:9px 10px}.menu-pop{width:min(250px,82vw)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="wrap nav">

</header>

</div></section></main>

<script>(function(){const b=document.querySelector('.menu-toggle'),m=document.querySelector('.menu-pop');if(!b||!m)return;function setOpen(v){m.classList.toggle('open',v);b.setAttribute('aria-expanded',String(v));b.setAttribute('aria-label',v?'Close site menu':'Open site menu')}b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setOpen(!m.classList.contains('open'))});m.addEventListener('click',e=>{if(e.target.closest('a'))setOpen(false)});document.addEventListener('click',e=>{if(!m.contains(e.target)&&!b.contains(e.target))setOpen(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)})})();</script>
</body></html>
