<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07050d">
<meta name="description" content="PIXORUN is building a token launchpad ecosystem on Robinhood Chain. Private beta access is reserved for Genesis Pass holders.">
<title>PIXORUN — Build the Next</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050d;--panel:#100b1c;--text:#f8efff;--muted:#c2afd5;--purple:#bd62ff;--line:#8d45c9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:'VT323',monospace;font-size:22px;line-height:1.4;background-image:linear-gradient(rgba(167,76,255,.065) 1px,transparent 1px),linear-gradient(90deg,rgba(167,76,255,.065) 1px,transparent 1px),radial-gradient(ellipse at 50% 0,#29103f 0,transparent 55%);background-size:8px 8px,8px 8px,auto;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{width:min(1120px,calc(100% - 40px));margin:auto}
.nav{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #8d45c955;position:relative;z-index:10}
.logo img{width:145px;height:auto;display:block;filter:drop-shadow(0 0 12px #8d2cff55)}
.menu-wrap{position:relative;margin-left:auto;z-index:20}
.menu-toggle{width:48px;height:48px;display:grid;place-items:center;border:2px solid #c16aff;background:#160d25;color:#fff;box-shadow:4px 4px 0 #4e1b79;cursor:pointer}
.menu-toggle .dots{font:32px monospace;transform:translateY(-2px)}
.menu-pop{position:absolute;right:0;top:calc(100% + 12px);width:225px;padding:9px;display:none;background:#10091b;border:2px solid #c16aff;box-shadow:6px 6px 0 #4e1b79;z-index:30}
.menu-pop.open{display:block}
.menu-pop a{display:flex;justify-content:space-between;padding:13px 14px;min-height:48px;color:#fff;background:#170e26;border-bottom:1px solid #5d3183;font:21px 'VT323',monospace}
.menu-pop a:hover,.menu-pop a.active{background:#6f2ca5}
.home{min-height:calc(100svh - 83px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 0 58px;position:relative}
.home:before{content:"";position:absolute;width:min(780px,100%);height:520px;top:6%;left:50%;transform:translateX(-50%);background:radial-gradient(ellipse,#8427c633,transparent 68%);pointer-events:none}
.visual{width:min(470px,88vw);height:245px;position:relative;perspective:900px;z-index:1}
.orbit{position:absolute;inset:28px 55px;border:1px solid #c18aff88;border-radius:50%;transform:rotateX(67deg) rotateZ(-18deg);box-shadow:0 0 42px #982dff44,inset 0 0 30px #982dff33;animation:orbit 14s linear infinite}
.orbit.second{inset:12px 35px;transform:rotateX(67deg) rotateZ(48deg);border-color:#ed65ff66;animation-duration:19s}
.core{position:absolute;inset:30px 0;display:grid;place-items:center;animation:float 5s ease-in-out infinite}
.core img{height:210px;width:auto;max-width:80%;object-fit:contain;filter:drop-shadow(0 0 30px #a52cff88)}
@keyframes orbit{to{transform:rotateX(67deg) rotateZ(342deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotateY(-4deg)}50%{transform:translateY(-11px) rotateY(5deg)}}
.eyebrow{display:inline-block;margin:10px 0 14px;padding:9px 12px;border:1px solid #a94aff66;background:#160d25;color:#d9b5ff;font:9px 'Press Start 2P',monospace;line-height:1.8;letter-spacing:.04em;z-index:1}
h1{position:relative;margin:12px 0 16px;font:clamp(26px,5.4vw,48px)/1.55 'Press Start 2P',monospace;letter-spacing:-.04em;text-shadow:0 8px 40px #000;z-index:1}
h1 span{color:#c58aff}
.description{max-width:660px;margin:0 auto;color:var(--muted);font-size:25px;z-index:1}
.status{margin-top:25px;padding:10px 15px;border:1px solid #a94aff66;background:#160d25;color:#f0dcff;font:9px/1.9 'Press Start 2P',monospace;z-index:1}
.status span{color:#bd62ff;padding:0 5px}
.action{margin-top:25px;z-index:1}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:13px 20px;border:2px solid #d18aff;background:#7c29bd;color:#fff;box-shadow:4px 4px 0 #4e1b79;font:10px/1.7 'Press Start 2P',monospace;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #6b2a9b}
@media(max-width:600px){.nav{height:70px}.logo img{width:125px}.home{min-height:calc(100svh - 71px);padding:24px 0 42px}.visual{height:205px}.core img{height:178px}.description{font-size:22px}.eyebrow,.status{font-size:8px}.btn{font-size:9px;padding:12px 14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="wrap nav">
<a class="logo" href="/Pixorun/" aria-label="PIXORUN home"><img src="assets/924(1).png" alt="PIXORUN"></a>
<div class="menu-wrap">
<button class="menu-toggle" type="button" aria-label="Open site menu" aria-expanded="false" aria-controls="site-menu"><span class="dots">⋮</span></button>
<nav class="menu-pop" id="site-menu" aria-label="Site pages">
<a href="/Pixorun/" class="active">Home<span>↗</span></a>
<a href="/Pixorun/about/">About<span>↗</span></a>
<a href="/Pixorun/gtd/">GTD<span>↗</span></a>
<a href="/Pixorun/launchpad/">Launchpad<span>↗</span></a>
<a href="/Pixorun/genesis/">Genesis Pass<span>↗</span></a>
<a href="/Pixorun/roadmap/">Roadmap<span>↗</span></a>
<a href="/Pixorun/documents/">Documents<span>↗</span></a>
</nav>
</div>
</header>
<main>
<section class="wrap home">
<div class="visual" aria-hidden="true"><div class="orbit"></div><div class="orbit second"></div><div class="core"><img src="assets/927.png" alt=""></div></div>
<div class="eyebrow">BUILDING ON ROBINHOOD CHAIN</div>
<h1>PIXORUN<br><span>BUILD THE NEXT</span></h1>
<p class="description">A token launchpad ecosystem on Robinhood Chain, beginning with a Genesis Pass–gated private beta.</p>
<div class="status">PRIVATE BETA <span>•</span> GENESIS PASS HOLDERS ONLY</div>
<div class="action"><a class="btn" href="/Pixorun/genesis/">EXPLORE GENESIS PASS</a></div>
</section>
</main>
<script>
(function(){
const button=document.querySelector('.menu-toggle');
const menu=document.querySelector('.menu-pop');
if(!button||!menu)return;
function setOpen(open){menu.classList.toggle('open',open);button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'Close site menu':'Open site menu');}
button.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();setOpen(!menu.classList.contains('open'));});
menu.addEventListener('click',event=>{if(event.target.closest('a'))setOpen(false);});
document.addEventListener('click',event=>{if(!menu.contains(event.target)&&!button.contains(event.target))setOpen(false);});
document.addEventListener('keydown',event=>{if(event.key==='Escape')setOpen(false);});
})();
</script>
</body>
</html>
