<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07050d">
<meta name="description" content="PIXORUN Genesis Pass — a limited, transferable NFT granting private beta access to its holder.">
<title>PIXORUN — Genesis Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050d;--panel:#100b1c;--text:#f8efff;--muted:#c2afd5;--purple:#bd62ff;--line:#8d45c9}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--text);font:22px/1.4 'VT323',monospace;background-color:var(--bg);background-image:linear-gradient(#a74cff0d 1px,transparent 1px),linear-gradient(90deg,#a74cff0d 1px,transparent 1px),radial-gradient(ellipse at 50% 0,#29103f 0,transparent 58%);background-size:8px 8px,8px 8px,auto}
a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}
.nav{height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #8d45c955;position:relative;z-index:1001;overflow:visible!important}
.logo img{width:145px;height:auto;display:block}
.menu-wrap{position:relative;margin-left:auto;z-index:1002}
.menu-toggle{width:48px;height:48px;display:grid;place-items:center;border:2px solid #c16aff;background:#160d25;color:#fff;box-shadow:4px 4px 0 #4e1b79;cursor:pointer;position:relative;z-index:1003}
.menu-toggle .dots{font:32px monospace;transform:translateY(-2px)}
.menu-pop{position:absolute;right:0;top:calc(100% + 12px);width:225px;padding:9px;display:none;background:#10091b;border:2px solid #c16aff;box-shadow:6px 6px 0 #4e1b79;z-index:1005}
.menu-pop.open{display:block;animation:menuIn .16s ease-out}
.menu-pop a{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;min-height:48px;color:#fff;background:#170e26;border-bottom:1px solid #5d3183;font:21px 'VT323',monospace}
.menu-pop a:hover,.menu-pop a.active{background:#6f2ca5;outline:2px solid #e3baff}
@keyframes menuIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
main{min-height:calc(100vh - 150px);display:flex;align-items:center;padding:58px 0 72px}
.pass-layout{display:grid;grid-template-columns:1.04fr .96fr;gap:clamp(28px,5vw,72px);align-items:center;width:100%}
.visual{min-height:480px;position:relative;display:grid;place-items:center;border:2px solid #66359a;background:radial-gradient(ellipse at 50% 48%,#8d2cff38,transparent 64%),#100b1c;box-shadow:7px 7px 0 #28103e;overflow:hidden;perspective:900px}
.visual:before,.visual:after{content:"";position:absolute;width:78%;height:34%;border:1px solid #c18aff88;border-radius:50%;transform:rotateX(68deg) rotateZ(-22deg);box-shadow:0 0 34px #982dff44,inset 0 0 22px #982dff22;animation:orbit 19s linear infinite}
.visual:after{width:88%;height:39%;transform:rotateX(68deg) rotateZ(48deg);border-color:#ed65ff66;animation-duration:25s}
.visual img{position:relative;z-index:1;width:min(78%,390px);max-height:390px;object-fit:contain;filter:drop-shadow(0 0 32px #a52cff88);animation:float 5s ease-in-out infinite}
@keyframes orbit{to{transform:rotateX(68deg) rotateZ(338deg)}}@keyframes float{0%,100%{transform:translateY(0) rotateY(-4deg)}50%{transform:translateY(-12px) rotateY(5deg)}}
.info{padding:12px 0}
.eyebrow{display:inline-block;padding:9px 12px;border:1px solid #a94aff88;background:#160d25;color:#d9b5ff;font:9px/1.8 'Press Start 2P',monospace}
h1{font:clamp(22px,3.4vw,38px)/1.65 'Press Start 2P',monospace;letter-spacing:-.04em;margin:22px 0 14px}
h1 span{color:#c58aff}
.sub{font-size:25px;color:var(--muted);margin:0 0 27px}
.access{display:inline-flex;align-items:center;gap:10px;padding:10px 13px;margin-bottom:25px;border:1px solid #b76aff88;background:#1a1028;color:#f1ddff;font:9px/1.8 'Press Start 2P',monospace}
.access i{width:8px;height:8px;background:#bd62ff;box-shadow:0 0 12px #bd62ff;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid #66359a;background:#100b1c;box-shadow:5px 5px 0 #28103e}
.stat{padding:18px 10px;text-align:center;border-right:1px solid #66359a}.stat:last-child{border:0}
.stat strong{display:block;color:#e6c8ff;font:clamp(14px,2vw,20px) 'Press Start 2P',monospace;margin-bottom:12px}
.stat span{display:block;color:#c2afd5;font-size:19px}
.rule{height:1px;background:#8d45c955;margin:25px 0 18px}
.note{font-size:22px;color:#d4c0e6;margin:0}
.note b{color:#f2ddff;font-weight:normal}
.footer{border-top:1px solid #8d45c955;padding:22px 0;color:#9d8bab;font-size:18px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.footer a{margin-left:auto;color:#d8a6ff}.footer a:hover{color:#fff}
@media(max-width:760px){.wrap{width:min(100% - 30px,560px)}.nav{height:74px}.logo img{width:125px}main{padding:35px 0 48px}.pass-layout{grid-template-columns:1fr;gap:30px}.visual{min-height:310px}.visual img{width:min(72%,270px);max-height:270px}.info{text-align:center;padding:0}.sub{margin-bottom:20px}.stats{max-width:480px;margin:auto}.stat{padding:15px 5px}.stat strong{font-size:13px}.footer{font-size:16px}.menu-pop{width:min(250px,82vw)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="wrap nav">
<a class="logo" href="../" aria-label="PIXORUN home"><img src="../assets/924(1).png" alt="PIXORUN"></a>
<div class="menu-wrap">
<button class="menu-toggle" type="button" aria-label="Open site menu" aria-expanded="false" aria-controls="site-menu"><span class="dots">⋮</span></button>
<nav class="menu-pop" id="site-menu" aria-label="Site pages">
<a href="/Pixorun/">Home<span>↗</span></a>
<a href="/Pixorun/gtd/">GTD<span>↗</span></a>
<a href="/Pixorun/launchpad/">Launchpad<span>↗</span></a>
<a href="/Pixorun/genesis/" class="active">Genesis Pass<span>↗</span></a>
<a href="/Pixorun/roadmap/">Roadmap<span>↗</span></a>
<a href="/Pixorun/documents/">Documents<span>↗</span></a>
<a href="/Pixorun/about/">About<span>↗</span></a>
</nav>
</div>
</header>
<main class="wrap">
<section class="pass-layout" aria-labelledby="pass-title">
<div class="visual"><img src="../assets/927.png" alt="PIXORUN Genesis Pass NFT artwork"></div>
<div class="info">
<div class="eyebrow">PIXORUN • GENESIS COLLECTION</div>
<h1 id="pass-title">GENESIS<br><span>PASS</span></h1>
<p class="sub">Your key to the PIXORUN Private Beta.</p>
<div class="access"><i></i> PRIVATE BETA ACCESS</div>
<div class="stats">
<div class="stat"><strong>?</strong><span>Total Supply</span></div>
<div class="stat"><strong>?</strong><span>Marketplace</span></div>
<div class="stat"><strong>?</strong><span>Release Date</span></div>
</div>
<div class="rule"></div>
<p class="note"></p>
</div>
</section>
</main>
<footer class="wrap footer"><span>© 2026 PIXORUN</span><a href="https://x.com/pixorun" target="_blank" rel="noopener noreferrer">FOLLOW PIXORUN ON X ↗</a></footer>
<script>
(function(){const b=document.querySelector('.menu-toggle'),m=document.querySelector('.menu-pop');if(!b||!m)return;function setOpen(v){m.classList.toggle('open',v);b.setAttribute('aria-expanded',String(v));b.setAttribute('aria-label',v?'Close site menu':'Open site menu')}b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();setOpen(!m.classList.contains('open'))});m.addEventListener('click',function(e){if(e.target.closest('a'))setOpen(false)});document.addEventListener('click',function(e){if(!m.contains(e.target)&&!b.contains(e.target))setOpen(false)});document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false)})})();
</script>
</body>
</html>
